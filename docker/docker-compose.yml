services:
  robot_sim:
    build: .
    image: robot_sim:1.0.0
    tty: true
    stdin_open: true
    environment:
      - DISPLAY
    volumes:
      - /tmp/.X11-unix:/tmp/.X11-unix:/tmp/.X11-unix
    deploy: 
      resources:
        reservations:
          devices:
            - capabilities: [gpu]
              driver: nvidia
              count: all
